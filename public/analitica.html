<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VYRALES // Analítica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#070b16; --bg-1:#0b1020; --panel:#0f1527; --panel-2:#121a30;
    --border:rgba(124,156,255,.14); --border-strong:rgba(124,156,255,.28);
    --cyan:#49d8ff; --cyan-2:#36e5c4; --purple:#a26bff; --purple-2:#7a5cff; --pink:#ff6bd6;
    --green:#3ddc97; --red:#ff5d72; --orange:#ffb15c;
    --text:#eaf1ff; --text-dim:#8fa0c7; --text-dim-2:#60729c;
    --grid-line:rgba(124,156,255,.08); --glow-cyan:0 0 20px rgba(73,216,255,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:#070b16}
  body{font-family:'Inter',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;
    background:radial-gradient(ellipse 900px 500px at 15% -10%,rgba(73,216,255,.08),transparent 60%),radial-gradient(ellipse 900px 600px at 110% 10%,rgba(162,107,255,.10),transparent 60%),linear-gradient(180deg,var(--bg-0),var(--bg-1) 40%,var(--bg-0));background-attachment:fixed}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  .app{display:flex;min-height:100vh}
  .sidebar{width:64px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 0;border-right:1px solid var(--border);background:linear-gradient(180deg,rgba(15,21,39,.6),rgba(10,14,26,.3));position:sticky;top:0;height:100vh}
  .side-icon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:12px;color:var(--text-dim);transition:.2s}
  .side-icon:hover{color:var(--text);background:rgba(124,156,255,.08)}
  .side-icon.active{color:var(--cyan);background:linear-gradient(135deg,rgba(73,216,255,.18),rgba(122,92,255,.14));box-shadow:inset 0 0 0 1px rgba(73,216,255,.35),var(--glow-cyan)}
  .side-icon svg{width:19px;height:19px}
  .main{flex:1;min-width:0;padding:14px 26px 50px;max-width:1920px;margin:0 auto}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--border)}
  .topbar-left{display:flex;align-items:center;gap:14px}
  .back-btn{display:flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--border);color:var(--text-dim);font-size:12px;font-weight:700;letter-spacing:.4px}
  .back-btn:hover{color:var(--cyan);border-color:rgba(73,216,255,.4)}
  .brand h1{font-family:'Rajdhani',sans-serif;font-size:22px;font-weight:700;letter-spacing:.5px;display:flex;align-items:baseline;gap:10px;text-transform:uppercase}
  .brand h1 span{font-family:'Inter',sans-serif;font-size:12.5px;font-weight:500;color:var(--text-dim);text-transform:none}
  .topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .online-badge{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;letter-spacing:.5px;padding:6px 12px;border-radius:20px;color:var(--green);background:rgba(61,220,151,.08);border:1px solid rgba(61,220,151,.3)}
  .online-badge.off{color:var(--orange);background:rgba(255,177,92,.08);border-color:rgba(255,177,92,.3)}
  .online-badge i{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;display:block}
  .date-badge{font-size:12px;color:var(--text-dim);font-weight:600;padding:6px 12px;border:1px solid var(--border);border-radius:20px}
  .refresh{font-size:12px;font-weight:700;padding:6px 12px;border:1px solid var(--border-strong);border-radius:20px;color:var(--cyan)}
  .refresh:hover{background:rgba(73,216,255,.08)}
  .setup{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
  .setup-item{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 14px;border-radius:12px;border:1px solid rgba(255,177,92,.3);background:rgba(255,177,92,.06);font-size:12.5px;line-height:1.4}
  .setup-item b{color:var(--orange)}
  .setup-actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn-sm{font-size:11.5px;font-weight:800;letter-spacing:.3px;padding:7px 12px;border-radius:9px;border:1px solid rgba(73,216,255,.4);color:var(--cyan);background:rgba(73,216,255,.06);white-space:nowrap}
  .btn-sm:hover{background:rgba(73,216,255,.14)}
  .platform-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
  .platform-card{background:linear-gradient(145deg,var(--panel),var(--panel-2));border:1px solid var(--border);border-radius:14px;padding:12px 16px;position:relative;overflow:hidden}
  .platform-card::before{content:"";position:absolute;inset:0;background:radial-gradient(120px 60px at 0% 0%,rgba(73,216,255,.10),transparent 70%);pointer-events:none}
  .pc-head{display:flex;align-items:center;gap:9px;margin-bottom:7px}
  .pc-icon{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none}
  .pc-icon svg{width:16px;height:16px}
  .pc-name{font-weight:700;font-size:14.5px}
  .pc-stat{font-family:'Rajdhani',sans-serif;font-size:25px;font-weight:700;margin-bottom:1px}
  .pc-stat small{font-family:'Inter',sans-serif;font-size:11px;color:var(--text-dim);font-weight:600;margin-left:4px}
  .pc-sub{font-size:11.5px;color:var(--text-dim);margin-bottom:4px}
  .pc-status{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.3px}
  .pc-status.up{color:var(--green)} .pc-status.warn{color:var(--orange)} .pc-status.off{color:var(--text-dim-2)}
  .ig-youtube .pc-icon{background:linear-gradient(135deg,#ff3b3b,#b30000)}
  .ig-tiktok .pc-icon{background:linear-gradient(135deg,#24f1e0,#ff2d78)}
  .ig-instagram .pc-icon{background:linear-gradient(135deg,#ffb23e,#ff2d9e,#9b2bff)}
  .ig-facebook .pc-icon{background:linear-gradient(135deg,#4e8dff,#2550c9)}
  .tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .tab{font-size:12.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:9px 18px;border-radius:10px;color:var(--text-dim);border:1px solid var(--border)}
  .tab.active{color:var(--bg-0);background:linear-gradient(135deg,var(--cyan),var(--purple-2));border-color:transparent;box-shadow:var(--glow-cyan)}
  .section-title{font-size:12.5px;font-weight:800;letter-spacing:1.2px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .section-title .bar{width:4px;height:14px;border-radius:2px;background:linear-gradient(180deg,var(--cyan),var(--purple))}
  .dash-grid{display:grid;grid-template-columns:1.5fr 1.1fr 1.2fr;gap:16px;align-items:start}
  .col{display:flex;flex-direction:column;gap:11px;min-width:0}
  .panel{background:linear-gradient(160deg,var(--panel),var(--panel-2));border:1px solid var(--border);border-radius:16px;padding:13px}
  .card-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
  .card-title .t{font-size:12px;font-weight:700;color:var(--text-dim)}
  .card-title .v{font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:700}
  .muted{font-size:11px;color:var(--text-dim-2);line-height:1.45}
  .chart{position:relative}
  .chart svg{width:100%;height:auto;display:block;overflow:visible}
  .axis-labels{display:flex;justify-content:space-between;font-size:9.5px;color:var(--text-dim-2);margin-top:3px}
  .tip{position:absolute;pointer-events:none;background:rgba(6,10,22,.95);border:1px solid var(--border-strong);border-radius:8px;padding:6px 9px;font-size:11px;line-height:1.4;white-space:nowrap;z-index:5;display:none;transform:translate(-50%,-110%)}
  .tip b{font-family:'Rajdhani',sans-serif;font-size:14px}
  .vid{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
  .vid:last-child{border-bottom:none}
  .vid img,.vid .ph{width:44px;height:58px;border-radius:7px;object-fit:cover;flex:none;background:#0a1020;border:1px solid var(--border)}
  .vid .info{flex:1;min-width:0;display:block}
  .vid .ttl{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vid .meta{font-size:10.5px;color:var(--text-dim);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
  .vid .num{display:block;font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:700;text-align:right;flex:none}
  .vid .num small{display:block;font-family:'Inter',sans-serif;font-size:9.5px;color:var(--text-dim-2);font-weight:600}
  .pill{font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:20px;border:1px solid var(--border-strong);color:var(--text-dim)}
  .pill.hot{border-color:rgba(255,107,214,.5);color:var(--pink)}
  .plat{font-size:9px;font-weight:800;letter-spacing:.4px;color:var(--text-dim-2)}
  .scatter-wrap{position:relative;height:190px;border-radius:10px;border:1px solid var(--border);overflow:hidden;background:#060a16;
    background-image:radial-gradient(110px 85px at 78% 25%,rgba(122,92,255,.25),transparent 65%),radial-gradient(90px 70px at 25% 75%,rgba(73,216,255,.18),transparent 65%)}
  .scatter-wrap svg{position:absolute;inset:0;width:100%;height:100%}
  .badge-ring{position:absolute;right:10px;top:10px;width:66px;height:66px;border-radius:50%;background:rgba(6,10,22,.8);border:2px solid var(--cyan);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 18px rgba(73,216,255,.45);text-align:center}
  .badge-ring b{font-family:'Rajdhani',sans-serif;font-size:17px;color:var(--cyan)}
  .badge-ring span{font-size:7px;letter-spacing:.3px;color:var(--text-dim);font-weight:700;line-height:1.2}
  .alerts{display:flex;flex-direction:column;gap:7px}
  .alert{display:flex;gap:8px;font-size:11.5px;line-height:1.4}
  .alert i{width:7px;height:7px;border-radius:50%;margin-top:5px;flex:none;background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
  .alert.hot i{background:var(--pink);box-shadow:0 0 6px var(--pink)}
  .alert.warn i{background:var(--orange);box-shadow:0 0 6px var(--orange)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .buckets{display:flex;flex-direction:column;gap:6px;margin-top:4px}
  .bk{display:grid;grid-template-columns:62px 1fr 44px;align-items:center;gap:7px;font-size:10.5px;color:var(--text-dim)}
  .bk .track{height:8px;border-radius:4px;background:var(--grid-line);overflow:hidden}
  .bk .fill{height:100%;border-radius:4px;background:var(--cyan)}
  .bk.best{color:var(--text)} .bk.best .fill{background:linear-gradient(90deg,var(--cyan),var(--purple))}
  .bk .n{text-align:right;font-family:'Rajdhani',sans-serif;font-size:12.5px;font-weight:700;color:var(--text)}
  .summary-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;padding:6px 0;border-bottom:1px solid var(--border)}
  .summary-row:last-child{border-bottom:none}
  .summary-label{color:var(--text-dim);font-weight:600}
  .summary-val{font-weight:800;font-family:'Rajdhani',sans-serif;font-size:15px}
  .topic{padding:10px 12px}
  .topic-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
  .ai-label{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:.4px;color:var(--cyan)}
  .ai-label svg{width:12px;height:12px}
  .mult{font-size:11px;font-weight:800;color:var(--green)}
  .mult.low{color:var(--text-dim)}
  .topic h3{font-size:14px;font-weight:700;margin-bottom:4px}
  .topic p{font-size:11.5px;color:var(--text-dim);line-height:1.45}
  .idea{padding:11px 12px}
  .idea h3{font-size:14px;font-weight:700;margin:6px 0 4px}
  .idea .hook{font-size:12px;color:var(--text);font-style:italic;line-height:1.45;margin-bottom:6px}
  .idea .why{font-size:11px;color:var(--text-dim);line-height:1.45;margin-bottom:8px}
  .idea-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag-pill{font-size:9.5px;font-weight:700;padding:4px 10px;border-radius:20px;color:#071019;background:linear-gradient(135deg,var(--cyan),var(--purple-2))}
  .tag-pill.new{background:linear-gradient(135deg,var(--orange),var(--pink))}
  .focus{width:100%;background:rgba(6,10,22,.6);border:1px solid var(--border);border-radius:10px;padding:9px 12px;color:var(--text);font:inherit;font-size:12px;margin-bottom:8px}
  .focus:focus{outline:none;border-color:rgba(73,216,255,.5)}
  .generar-btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:12px;border-radius:12px;font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--cyan);background:rgba(73,216,255,.06);border:1.5px solid rgba(73,216,255,.4);box-shadow:0 0 18px rgba(73,216,255,.15),inset 0 0 18px rgba(73,216,255,.06)}
  .generar-btn:hover{background:rgba(73,216,255,.12)}
  .generar-btn:disabled{opacity:.5;cursor:wait}
  .generar-btn svg{width:15px;height:15px}
  .empty{font-size:12px;color:var(--text-dim);text-align:center;padding:20px 8px;line-height:1.5}
  .err{color:var(--red);font-size:12px;padding:8px 0}
  .loading{padding:60px 0;text-align:center;color:var(--text-dim);font-size:13px}
  .rank{width:18px;flex:none;font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;color:var(--text-dim-2);text-align:center}
  .modal{position:fixed;inset:0;z-index:30;background:rgba(3,6,14,.75);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:16px}
  .modal-box{width:100%;max-width:760px;max-height:86vh;display:flex;flex-direction:column}
  .modal-body{overflow-y:auto;padding-right:4px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel-2);border:1px solid rgba(61,220,151,.4);color:var(--green);padding:9px 16px;border-radius:10px;font-size:12.5px;font-weight:700;display:none;z-index:20}
  @media (max-width:1279px){ .dash-grid{grid-template-columns:1fr 1fr} .col.reco{grid-column:1 / -1} }
  @media (max-width:899px){
    .app{flex-direction:column}
    .sidebar{width:100%;height:auto;position:static;flex-direction:row;padding:8px 14px;border-right:none;border-bottom:1px solid var(--border)}
    .main{padding:14px 16px 30px}
    .brand h1{font-size:18px;flex-direction:column;gap:0}
    .platform-row{grid-template-columns:1fr 1fr}
    .dash-grid{grid-template-columns:1fr}
  }
  @media (max-width:560px){ .platform-row,.two{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar">
    <a class="side-icon" href="/" title="Panel principal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></a>
    <a class="side-icon active" href="/analitica.html" title="Analítica"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M12 20V4M20 20v-7"/></svg></a>
    <button class="side-icon" onclick="load(true)" title="Actualizar datos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg></button>
  </nav>

  <main class="main">
    <div class="topbar">
      <div class="topbar-left">
        <a class="back-btn" href="/" title="Volver al panel"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>PANEL</a>
        <div class="brand"><h1>Social Insights Hub <span id="brandSub">— VYRALES · analítica real de tus redes</span></h1></div>
      </div>
      <div class="topbar-right">
        <div class="online-badge" id="liveBadge"><i></i>CARGANDO</div>
        <div class="date-badge" id="dateBadge"></div>
        <button class="refresh" onclick="load(true)">↻ Actualizar</button>
      </div>
    </div>

    <div class="setup" id="setup"></div>
    <div class="platform-row" id="platforms"></div>

    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="todos">Todos</button>
      <button class="tab" data-tab="youtube">YouTube</button>
      <button class="tab" data-tab="instagram">Instagram</button>
      <button class="tab" data-tab="facebook">Facebook</button>

  </main>
</div>
<div class="modal" id="modal"><div class="modal-box panel"><div class="card-title" style="margin-bottom:10px"><span class="t" id="modalTitle" style="font-size:14px;color:var(--text)"></span><button class="btn-sm" id="modalClose">✕ Cerrar</button></div><div class="modal-body" id="modalBody"></div></div></div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const fmt = (n) => n == null ? '—' : n >= 1e6 ? (n/1e6).toFixed(1).replace('.0','') + 'M' : n >= 1e4 ? (n/1e3).toFixed(1).replace('.0','') + 'K' : Number(n).toLocaleString('es');
  const key = () => { try { return localStorage.getItem('vyrales_key'); } catch (_) { return null; } };
  const store = { get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch (_) { return null; } }, set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} } };
  let DATA = null, TAB = store.get('vy_an_tab') || 'todos';
  let WS = 'x'; // canal activo (se llena al arrancar con /me). Las cachés de ideas y largos van POR canal.
  const idKey = () => 'vy_an_ideas_' + WS;
  const lgKey = () => 'vy_largos_' + WS;
  async function cargarCanalActivo() {
    try {
      // Igual que load(): SIN la llave, para que use la cookie y vea el CANAL activo (no el admin).
      const r = await fetch('/.netlify/functions/me', { cache: 'no-store' });
      if (!r.ok) return;
      const j = await r.json();
      const w = j.workspace || {};
      WS = w.id || 'x';
      const nom = (w.name && w.name !== 'Admin') ? w.name : 'VYRALES';
      const sub = document.getElementById('brandSub');
      if (sub) sub.textContent = '— ' + nom + ' · analítica real de tus redes';
    } catch (_) {}
  }
  const ICON = {
    youtube:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M23 7.2s-.2-1.6-.9-2.3c-.9-.9-1.9-.9-2.3-1C16.9 3.6 12 3.6 12 3.6s-4.9 0-7.8.3c-.4 0-1.4.1-2.3 1C1.2 5.6 1 7.2 1 7.2S.8 9 .8 10.9v1.9c0 1.9.2 3.7.2 3.7s.2 1.6.9 2.3c.9.9 2 .9 2.5 1 1.8.2 7.6.3 7.6.3s4.9 0 7.8-.3c.4 0 1.4-.1 2.3-1 .7-.7.9-2.3.9-2.3s.2-1.8.2-3.7v-1.9c0-1.9-.2-3.7-.2-3.7zM9.7 14.8V8.3l6 3.3-6 3.2z"/></svg>',
    tiktok:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M16.6 5.8c-.9-.9-1.4-2.1-1.4-3.4h-3v13.6a2.6 2.6 0 1 1-1.8-2.5V9.9a5.6 5.6 0 1 0 4.8 5.5V9.4a7.3 7.3 0 0 0 4.2 1.3V7.7c0-.1-1.8 0-2.8-1.9z"/></svg>',
    instagram:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="#fff" stroke="none"/></svg>',
    facebook:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M13.5 21v-7.6h2.6l.4-3h-3v-1.9c0-.9.2-1.5 1.5-1.5H16.6V4.3c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4V10.4H7.8v3h2.6V21h3.1z"/></svg>'
  };
  const SPARK = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8L12 2z"/></svg>';
  const TRAFFIC = { SHORTS:'Feed de Shorts', SUBSCRIBER:'Suscriptores', YT_SEARCH:'Búsqueda', RELATED_VIDEO:'Videos sugeridos', EXT_URL:'Fuera de YouTube', NO_LINK_OTHER:'Directo / otro', YT_CHANNEL:'Tu canal', YT_OTHER_PAGE:'Otras páginas de YouTube', PLAYLIST:'Listas', NOTIFICATION:'Notificaciones', END_SCREEN:'Pantallas finales', HASHTAGS:'Hashtags', SOUND_PAGE:'Página de sonido', BROWSE:'Inicio / Explorar' };

  $('dateBadge').textContent = new Date().toLocaleDateString('es', { month: 'long', year: 'numeric' }).toUpperCase();
  function toast(msg){ const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 2200); }

  // ---------- tooltip ----------
  const tip = $('tip');
  function bindTips(root){
    root.querySelectorAll('[data-tip]').forEach((el) => {
      el.addEventListener('mouseenter', () => { tip.innerHTML = el.getAttribute('data-tip'); tip.style.display = 'block'; });
      el.addEventListener('mousemove', (e) => { tip.style.left = e.clientX + 'px'; tip.style.top = (e.clientY - 8 + window.scrollY) + 'px'; });
      el.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
    });
  }
  tip.style.position = 'absolute';

  // ---------- data ----------
  async function load(fresh){
    $('liveBadge').className = 'online-badge off'; $('liveBadge').innerHTML = '<i></i>CARGANDO';
    try {
      const r = await fetch('/.netlify/functions/analytics' + (fresh ? '?fresh=1' : ''), { cache: 'no-store' });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
      DATA = j;
      $('liveBadge').className = 'online-badge'; $('liveBadge').innerHTML = '<i></i>EN VIVO · ' + new Date(j.at).toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
      render();
    } catch (err) {
      $('liveBadge').innerHTML = '<i></i>SIN DATOS';
      $('content').innerHTML = '<div class="panel err">No se pudo leer la analítica: ' + esc(err.message) + '</div>';
    }
  }
  window.load = load;

  function items(){
    const d = DATA, out = [];
    const now = Date.now();
    const add = (platform, v) => {
      const hrs = Math.max(1, (now - new Date(v.published).getTime()) / 3600000);
      out.push(Object.assign({ platform, hrs, perHour: v.views != null ? v.views / hrs : null }, v));
    };
    if (TAB === 'todos' || TAB === 'youtube') (d.youtube.videos || []).filter((v) => v.privacy !== 'private').forEach((v) => add('youtube', v));
    if (TAB === 'todos' || TAB === 'instagram') (d.instagram.media || []).forEach((v) => add('instagram', v));
    if (TAB === 'todos' || TAB === 'facebook') (d.facebook.media || []).forEach((v) => add('facebook', v));
    return out;
  }
  const clean = (t) => String(t || '').replace(/\s*#\S+/g, '').replace(/\s*\|\s*Parte\s*\d+\/\d+/i, '').trim();
  const median = (a) => { const s = a.slice().sort((x, y) => x - y); return s.length ? (s.length % 2 ? s[(s.length - 1) / 2] : (s[s.length / 2 - 1] + s[s.length / 2]) / 2) : 0; };

  // ---------- render ----------
  function render(){
    const d = DATA;
    renderSetup(d);
    renderPlatforms(d);
    document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t.dataset.tab === TAB));
    const list = items();
    const withViews = list.filter((v) => v.views != null);
    const yt = d.youtube || {}, an = yt.analytics || {};
    const medPH = median(withViews.map((v) => v.perHour));
    withViews.forEach((v) => { v.hot = v.hrs <= 72 && medPH > 0 && v.perHour >= 2 * medPH && v.views >= 100; });

    const col1 = `
      <div class="col">
        <div class="section-title"><i class="bar"></i>MÉTRICAS CLAVE</div>
        ${an.ok ? chartDaily(an.daily, 'views', 'Vistas por día (28 días)', 'line') + chartDaily(an.daily, 'subs', 'Suscriptores netos por día', 'bars') : ''}
        ${chartPerVideo(withViews)}
        ${summaryCard(d, withViews)}
        ${an.ok && an.traffic && an.traffic.length ? trafficCard(an.traffic) : ''}
      </div>`;

    const col2 = `
      <div class="col">
        <div class="section-title"><i class="bar"></i>ANÁLISIS DEL ALGORITMO</div>
        <div class="panel">
          <div class="card-title"><span class="t">TOP 5 MÁS VIRALES${TAB === 'todos' ? '' : ' · ' + TAB.toUpperCase()}</span><span class="muted">${list.length} en total</span></div>
          ${videoList(list, 5)}
          ${list.length > 5 ? '<button class="generar-btn" id="moreBtn" style="margin-top:10px;padding:10px">VER TODOS LOS VIDEOS (' + list.length + ')</button>' : ''}
        </div>
        ${scatterCard(withViews, an.ok)}
        <div class="panel"><div class="card-title"><span class="t">ALERTAS</span></div><div class="alerts">${alerts(d, withViews, medPH)}</div></div>
        <div class="two">
          ${bucketCard('Duración que más rinde', withViews.filter((v) => v.duration), (v) => v.duration < 60 ? '< 60 s' : v.duration < 90 ? '60–90 s' : v.duration < 120 ? '90–120 s' : v.duration < 180 ? '2–3 min' : '> 3 min', ['< 60 s','60–90 s','90–120 s','2–3 min','> 3 min'])}
          ${bucketCard('Hora de publicación', withViews, (v) => { const h = new Date(v.published).getHours(); return h < 6 ? '0–6 h' : h < 12 ? '6–12 h' : h < 18 ? '12–18 h' : '18–24 h'; }, ['0–6 h','6–12 h','12–18 h','18–24 h'])}
        </div>
      </div>`;

    const col3 = `
      <div class="col reco">
        <div class="section-title"><i class="bar"></i>PRÓXIMOS VIDEOS A CREAR</div>
        ${topicCards(withViews)}
        <div class="panel">
          <div class="card-title"><span class="t">IDEAS DE GUION CON IA</span><span class="muted" id="ideasAt"></span></div>
          <input class="focus" id="focus" placeholder="Opcional: enfócate en… (ej. batallas de Roma)">
          <button class="generar-btn" id="genBtn">${SPARK} GENERAR NUEVAS IDEAS (CLAUDE EN TU PC, $0)</button>
          <div id="ideas" style="display:flex;flex-direction:column;gap:10px;margin-top:10px"></div>
        </div>
        <div class="panel" id="largosBox" style="display:none"><div class="card-title"><span class="t">VIDEOS LARGOS EN PROCESO</span></div><div id="largos"></div></div>
      </div>`;

    $('content').innerHTML = '<div class="dash-grid">' + col1 + col2 + col3 + '</div>';
    $('genBtn').onclick = genIdeas;
    if ($('moreBtn')) $('moreBtn').onclick = () => openModal(list);
    renderIdeas(store.get(idKey()));
    renderLargos();
    bindTips($('content'));
  }

  function renderSetup(d){
    const out = [];
    const an = (d.youtube && d.youtube.analytics) || {};
    if (d.youtube && d.youtube.connected === false) out.push(['<b>YouTube no está conectado.</b>', '<a class="btn-sm" href="/.netlify/functions/oauth-youtube-start">Conectar YouTube</a>']);
    else if (an.reason === 'api_disabled') out.push(['<b>Paso 1 de 2:</b> activa "YouTube Analytics API" en Google Cloud (botón Habilitar). <b>Paso 2:</b> dale "Reconectar YouTube" y acepta el permiso de estadísticas. Así aparecen % visto, suscriptores por video y vistas por día.', '<a class="btn-sm" target="_blank" rel="noopener" href="https://console.cloud.google.com/apis/library/youtubeanalytics.googleapis.com?project=1037421829901">1 · Activar API</a><a class="btn-sm" href="/.netlify/functions/oauth-youtube-start">2 · Reconectar YouTube</a>']);
    else if (an.reason === 'scope') out.push(['<b>Falta el permiso de estadísticas de YouTube.</b> Reconecta y acepta "ver informes de YouTube Analytics".', '<a class="btn-sm" href="/.netlify/functions/oauth-youtube-start">Reconectar YouTube</a>']);
    else if (an.reason) out.push(['<b>YouTube Analytics:</b> ' + esc(an.msg), '']);
    if (d.facebook.connected && d.facebook.insights === false) out.push(['<b>Facebook:</b> se ven seguidores, pero las <b>vistas</b> de los Reels piden el permiso <b>read_insights</b>. Dale Reconectar y acepta los permisos.', '<a class="btn-sm" href="/.netlify/functions/oauth-meta-start">Reconectar Facebook + Instagram</a>']);
    $('setup').innerHTML = out.map(([t, a]) => `<div class="setup-item"><span>${t}</span><span class="setup-actions">${a}</span></div>`).join('');
  }

  function pcard(cls, name, stat, unit, sub, status, stClass){
    return `<div class="platform-card ig-${cls}"><div class="pc-head"><div class="pc-icon">${ICON[cls]}</div><div class="pc-name">${name}</div></div>
      <div class="pc-stat">${stat}<small>${unit}</small></div><div class="pc-sub">${sub}</div><div class="pc-status ${stClass}">${status}</div></div>`;
  }
  function renderPlatforms(d){
    const yt = d.youtube || {}, ig = d.instagram || {}, fb = d.facebook || {}, tt = d.tiktok || {};
    const an = yt.analytics || {};
    const ytSub = an.ok && an.totals ? `${fmt(an.totals.views)} vistas · ${an.totals.subs >= 0 ? '+' : ''}${an.totals.subs} subs en 28 días` : `${fmt(yt.channel && yt.channel.views)} vistas totales · ${yt.channel ? yt.channel.videos : 0} videos`;
    const hot = (yt.videos || []).some((v) => (Date.now() - new Date(v.published)) < 72 * 3600000 && v.views >= 500);
    $('platforms').innerHTML = [
      yt.connected ? pcard('youtube', 'YouTube', fmt(yt.channel && yt.channel.subs), 'suscriptores', ytSub, hot ? '▲ UN VIDEO RECIENTE ESTÁ MOVIÉNDOSE' : '● CONECTADO', hot ? 'up' : 'up') : pcard('youtube', 'YouTube', '—', '', 'No conectado', 'CONECTAR EN REDES', 'off'),
      tt.connected ? (tt.stats ? pcard('tiktok', 'TikTok', fmt(tt.followers), 'seguidores', `${fmt(tt.likes)} likes · ${tt.videos} videos`, '● CONECTADO', 'up') : pcard('tiktok', 'TikTok', '—', '', 'Conectado para publicar', '⚠ ESTADÍSTICAS: FALTA PERMISO DE TIKTOK', 'warn')) : pcard('tiktok', 'TikTok', '—', '', 'No conectado', 'CONECTAR EN REDES', 'off'),
      ig.connected ? pcard('instagram', 'Instagram', fmt(ig.followers), 'seguidores', `@${esc(ig.username || '')} · ${ig.posts || 0} publicaciones`, ig.insights ? '● CONECTADO' : '● CONECTADO · VISTAS AÚN NO DISPONIBLES', ig.insights ? 'up' : 'off') : pcard('instagram', 'Instagram', '—', '', 'No conectado', 'CONECTAR EN REDES', 'off'),
      fb.connected ? pcard('facebook', 'Facebook', fmt(fb.followers), 'seguidores', `${esc(fb.name || '')} · ${(fb.media || []).length} reels`, fb.insights ? '● CONECTADO' : '⚠ VISTAS: FALTA PERMISO', fb.insights ? 'up' : 'warn') : pcard('facebook', 'Facebook', '—', '', 'No conectado', 'CONECTAR EN REDES', 'off')
    ].join('');
  }

  // ---------- charts ----------
  function chartDaily(daily, field, label, kind){
    if (!daily || !daily.length) return '';
    const W = 400, H = 130, P = 8;
    const vals = daily.map((r) => r[field] || 0);
    const max = Math.max(1, ...vals), min = Math.min(0, ...vals);
    const x = (i) => P + i * (W - 2 * P) / Math.max(1, daily.length - 1);
    const y = (v) => H - 12 - (v - min) / (max - min || 1) * (H - 24);
    const total = vals.reduce((a, b) => a + b, 0);
    let marks = '';
    const lab = (r) => `${new Date(r.day + 'T12:00:00').toLocaleDateString('es', { day: 'numeric', month: 'short' })}<br><b>${fmt(r[field])}</b> ${field === 'views' ? 'vistas' : 'subs'}`;
    if (kind === 'line') {
      const pts = daily.map((r, i) => `${x(i).toFixed(1)},${y(r[field] || 0).toFixed(1)}`).join(' ');
      marks = `<path d="M${x(0)},${H - 12} L${pts.replace(/ /g, ' L')} L${x(daily.length - 1)},${H - 12} Z" fill="url(#gA)"/><polyline points="${pts}" fill="none" stroke="#49d8ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      marks += daily.map((r, i) => `<rect x="${x(i) - (W / daily.length) / 2}" y="0" width="${W / daily.length}" height="${H}" fill="transparent" data-tip="${esc(lab(r))}"/>`).join('');
    } else {
      const bw = Math.max(3, (W - 2 * P) / daily.length - 2);
      marks = daily.map((r, i) => { const v = r[field] || 0, y0 = y(0), y1 = y(v); return `<rect x="${x(i) - bw / 2}" y="${Math.min(y0, y1)}" width="${bw}" height="${Math.max(1, Math.abs(y0 - y1))}" rx="2" fill="${v < 0 ? '#ff5d72' : '#a26bff'}" data-tip="${esc(lab(r))}"/>`; }).join('');
    }
    const grid = [0.25, 0.5, 0.75].map((f) => `<line x1="0" x2="${W}" y1="${12 + f * (H - 24)}" y2="${12 + f * (H - 24)}" stroke="rgba(124,156,255,.08)"/>`).join('');
    const d0 = new Date(daily[0].day + 'T12:00:00'), d1 = new Date(daily[daily.length - 1].day + 'T12:00:00');
    return `<div class="panel"><div class="card-title"><span class="t">${label}</span><span class="v">${field === 'subs' && total > 0 ? '+' : ''}${fmt(total)}</span></div>
      <div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#49d8ff" stop-opacity=".3"/><stop offset="100%" stop-color="#49d8ff" stop-opacity="0"/></linearGradient></defs>${grid}<line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="rgba(124,156,255,.22)"/>${marks}</svg></div>
      <div class="axis-labels"><span>${d0.toLocaleDateString('es', { day: 'numeric', month: 'short' })}</span><span>${d1.toLocaleDateString('es', { day: 'numeric', month: 'short' })} · YouTube Analytics va 1–2 días atrasado</span></div></div>`;
  }

  function chartPerVideo(list){
    const vids = list.slice().sort((a, b) => new Date(a.published) - new Date(b.published)).slice(-14);
    if (!vids.length) return '<div class="panel"><div class="empty">Todavía no hay vistas para mostrar en esta pestaña.</div></div>';
    const W = 400, H = 130, max = Math.max(1, ...vids.map((v) => v.views));
    const bw = (W - 8) / vids.length - 4;
    const bars = vids.map((v, i) => { const h = Math.max(2, v.views / max * (H - 20)); const xx = 4 + i * (bw + 4);
      return `<rect x="${xx}" y="${H - 6 - h}" width="${bw}" height="${h}" rx="3" fill="${v.hot ? '#ff6bd6' : '#49d8ff'}" data-tip="${esc('<b>' + fmt(v.views) + '</b> vistas · ' + v.platform + '<br>' + v.title.slice(0, 60))}"/>`; }).join('');
    return `<div class="panel"><div class="card-title"><span class="t">Vistas por video (en orden de publicación)</span><span class="muted">rosa = despegando</span></div>
      <div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="0" x2="${W}" y1="${H - 6}" y2="${H - 6}" stroke="rgba(124,156,255,.22)"/>${bars}</svg></div>
      <div class="axis-labels"><span>más antiguo</span><span>más reciente</span></div></div>`;
  }

  function trafficCard(tr){
    const total = tr.reduce((a, b) => a + b.views, 0) || 1;
    return `<div class="panel"><div class="card-title"><span class="t">De dónde llegan (28 días)</span></div><div class="buckets">${tr.slice(0, 5).map((t) =>
      `<div class="bk" style="grid-template-columns:120px 1fr 44px"><span>${esc(TRAFFIC[t.source] || t.source)}</span><span class="track"><span class="fill" style="display:block;width:${(t.views / total * 100).toFixed(1)}%"></span></span><span class="n">${Math.round(t.views / total * 100)}%</span></div>`).join('')}</div></div>`;
  }

  function videoList(list, limit){
    if (!list.length) return '<div class="empty">Sin videos en esta pestaña.</div>';
    const s = list.slice().sort((a, b) => (b.views ?? -1) - (a.views ?? -1) || new Date(b.published) - new Date(a.published));
    return s.slice(0, limit || s.length).map((v, i) => `<a class="vid" href="${esc(v.url || '#')}" target="_blank" rel="noopener">
        <span class="rank">${i + 1}</span>${v.thumb ? `<img src="${esc(v.thumb)}" alt="" loading="lazy">` : '<span class="ph"></span>'}
        <span class="info"><span class="ttl">${esc(v.title ? clean(v.title) + (/Parte \d+\/\d+/i.exec(v.title) && !/Parte 1\/1/i.test(v.title) ? ' · ' + /Parte \d+\/\d+/i.exec(v.title)[0] : '') : '(sin título)')}</span>
          <span class="meta"><span class="plat">${v.platform.toUpperCase()}</span><span class="pill">${esc(v.topic || 'Otros')}</span>${v.hot ? '<span class="pill hot">🔥 despegando</span>' : ''}${v.avgPct != null ? `<span>${Math.round(v.avgPct)}% visto</span>` : ''}${v.duration ? `<span>${v.duration}s</span>` : ''}${v.likes != null ? `<span>${fmt(v.likes)} ♥</span>` : ''}</span></span>
        <span class="num">${fmt(v.views)}<small>${v.views != null ? fmt(Math.round(v.perHour)) + '/h' : 'sin permiso'}</small></span></a>`).join('');
  }

  function scatterCard(list, hasAn){
    const pts = list.filter((v) => v.views > 0 && (hasAn ? v.avgPct != null : v.likes != null));
    const xv = (v) => hasAn ? v.avgPct : v.likes / v.views * 100;
    const xs = pts.map(xv), avg = xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : 0;
    const xmax = Math.max(hasAn ? 100 : 5, ...xs) * 1.05;
    const lmax = Math.log10(Math.max(10, ...pts.map((v) => v.views)) * 1.3);
    const dots = pts.map((v) => { const cx = 6 + xv(v) / xmax * 88, cy = 92 - Math.log10(Math.max(1, v.views)) / lmax * 84;
      return `<circle cx="${cx}%" cy="${cy}%" r="6" fill="${v.hot ? '#ff6bd6' : '#49d8ff'}" stroke="#060a16" stroke-width="2" data-tip="${esc('<b>' + fmt(v.views) + '</b> vistas · ' + (hasAn ? Math.round(v.avgPct) + '% visto' : xv(v).toFixed(1) + '% likes') + '<br>' + v.title.slice(0, 55))}"/>`; }).join('');
    return `<div class="panel"><div class="card-title"><span class="t">Vistas vs ${hasAn ? 'retención (% visto)' : 'interés (likes por vista)'}</span></div>
      <div class="scatter-wrap"><svg>${[25, 50, 75].map((f) => `<line x1="0" x2="100%" y1="${f}%" y2="${f}%" stroke="rgba(124,156,255,.08)"/><line y1="0" y2="100%" x1="${f}%" x2="${f}%" stroke="rgba(124,156,255,.08)"/>`).join('')}${dots}</svg>
        <div class="badge-ring"><b>${pts.length ? (hasAn ? Math.round(avg) + '%' : avg.toFixed(1) + '%') : '—'}</b><span>${hasAn ? 'VISTO<br>PROMEDIO' : 'LIKES POR<br>VISTA'}</span></div></div>
      <div class="axis-labels"><span>menos ${hasAn ? 'retención' : 'interés'}</span><span>↑ más vistas · más ${hasAn ? 'retención' : 'interés'} →</span></div>
      ${hasAn ? (list.filter((v) => v.platform === 'youtube' && v.avgPct == null).length ? '<p class="muted" style="margin-top:6px">' + list.filter((v) => v.platform === 'youtube' && v.avgPct == null).length + ' video(s) de YouTube muy recientes aún sin % visto (YouTube tarda 1–2 días). Instagram y Facebook no dan % visto.</p>' : '') : '<p class="muted" style="margin-top:6px">Cuando actives YouTube Analytics, este gráfico usa el % visto real (lo que más pesa en Shorts).</p>'}</div>`;
  }

  function bucketCard(title, list, keyFn, order){
    const g = {}; list.forEach((v) => { const k = keyFn(v); (g[k] = g[k] || []).push(v.views); });
    const rows = order.filter((k) => g[k]).map((k) => ({ k, n: g[k].length, avg: median(g[k]) }));
    if (!rows.length) return `<div class="panel"><div class="card-title"><span class="t">${title}</span></div><div class="empty">Sin datos</div></div>`;
    const max = Math.max(...rows.map((r) => r.avg)), best = rows.find((r) => r.avg === max);
    const few = list.length < 10;
    return `<div class="panel"><div class="card-title"><span class="t">${title}</span></div>
      <div class="card-title"><span class="v" style="color:var(--cyan)">${best.k}</span></div>
      <div class="buckets">${rows.map((r) => `<div class="bk ${r === best ? 'best' : ''}" data-tip="${esc(r.n + ' video(s) · mediana <b>' + fmt(Math.round(r.avg)) + '</b> vistas')}"><span>${r.k}</span><span class="track"><span class="fill" style="display:block;width:${(r.avg / max * 100).toFixed(1)}%"></span></span><span class="n">${fmt(Math.round(r.avg))}</span></div>`).join('')}</div>
      <p class="muted" style="margin-top:6px">${few ? '⚠ Pocos videos (' + list.length + '): tómalo como pista, no como regla.' : 'Mediana de vistas por video (un viral no distorsiona).'}</p></div>`;
  }

  function summaryCard(d, list){
    const an = d.youtube && d.youtube.analytics, yt = d.youtube || {};
    const rows = [];
    if (an && an.ok && an.totals) {
      rows.push(['Vistas (28 días)', fmt(an.totals.views)], ['% visto promedio', Math.round(an.totals.avgPct) + '%'], ['Suscriptores netos (28 días)', (an.totals.subs >= 0 ? '+' : '') + an.totals.subs], ['Horas vistas (28 días)', fmt(Math.round(an.totals.minutes / 60))]);
    } else {
      const v = list.filter((x) => x.views != null);
      const tv = v.reduce((a, b) => a + b.views, 0), tl = v.reduce((a, b) => a + (b.likes || 0), 0);
      rows.push(['Vistas (videos de esta pestaña)', fmt(tv)], ['Promedio por video', fmt(v.length ? Math.round(tv / v.length) : 0)], ['Mediana por video', fmt(Math.round(median(v.map((x) => x.views))))], ['Likes por cada 100 vistas', tv ? (tl / tv * 100).toFixed(1) : '—']);
    }
    if (yt.channel) rows.push(['Suscriptores YouTube', fmt(yt.channel.subs)]);
    return `<div class="panel"><div class="card-title"><span class="t">RESUMEN RÁPIDO</span></div>${rows.map(([l, v]) => `<div class="summary-row"><span class="summary-label">${l}</span><span class="summary-val">${v}</span></div>`).join('')}</div>`;
  }

  function alerts(d, list, medPH){
    const out = [];
    list.filter((v) => v.hot).forEach((v) => out.push(['hot', `🔥 <b>"${esc(clean(v.title).slice(0, 70))}"</b> va ${(v.perHour / medPH).toFixed(1)}× más rápido que tu video típico (${fmt(Math.round(v.perHour))} vistas/hora). Haz otro del mismo tema pronto.`]));
    // Series por partes: ¿la gente sigue a la parte 2/3?
    const parts = {};
    list.filter((v) => v.platform === 'youtube').forEach((v) => { const m = /Parte (\d+)\/(\d+)/i.exec(v.title); if (m && +m[2] > 1 && v.series) { (parts[v.series] = parts[v.series] || {})[+m[1]] = v.views; } });
    Object.entries(parts).forEach(([s, p]) => { if (p[1] && Object.keys(p).length > 1) { const last = Math.max(...Object.keys(p).map(Number)); const ratio = p[last] / p[1]; if (ratio < 0.3) out.push(['warn', `La serie <b>${esc(s)}</b>: la parte ${last} tiene ${Math.round(ratio * 100)}% de las vistas de la parte 1. En Shorts casi nadie busca la siguiente parte; mejor que cada video funcione solo.`]); } });
    const topTopic = topicStats(list)[0];
    if (topTopic && topTopic.n >= 1) out.push(['', `El tema que mejor rinde es <b>${esc(topTopic.topic)}</b>` + (topTopic.viral ? ` (tiene tu viral: ${fmt(topTopic.best.views)} vistas).` : ` (mediana ${fmt(Math.round(topTopic.med))} vistas por video).`)]);
    if (d.tiktok && d.tiktok.connected && !d.tiktok.stats) out.push(['warn', 'TikTok: sus estadísticas aún no se pueden leer (falta permiso en el portal de TikTok).']);
    return out.length ? out.map(([c, t]) => `<div class="alert ${c}"><i></i><span>${t}</span></div>`).join('') : '<div class="muted">Sin alertas por ahora.</div>';
  }

  function topicStats(list){
    const g = {};
    list.filter((v) => v.views != null).forEach((v) => { const t = v.topic || 'Otros'; (g[t] = g[t] || []).push(v); });
    const all = list.filter((v) => v.views != null), chMed = median(all.map((v) => v.views)), chMax = Math.max(0, ...all.map((v) => v.views));
    return Object.entries(g).map(([topic, vs]) => {
      const avg = vs.reduce((a, b) => a + b.views, 0) / vs.length;
      const pcts = vs.filter((v) => v.avgPct != null).map((v) => v.avgPct);
      const best = vs.slice().sort((a, b) => b.views - a.views)[0];
      const med = median(vs.map((v) => v.views));
      return { topic, n: vs.length, avg, viral: best.views === chMax && chMax >= 3 * chMed, mult: chMed ? med / chMed : 0, avgPct: pcts.length ? pcts.reduce((a, b) => a + b, 0) / pcts.length : null, best, med };
    }).filter((t) => t.topic !== 'Otros' || Object.keys(g).length === 1).sort((a, b) => (b.med * (b.avgPct || 50) + (b.viral ? 1e9 : 0)) - (a.med * (a.avgPct || 50) + (a.viral ? 1e9 : 0)));
  }

  function topicCards(list){
    const ts = topicStats(list).slice(0, 3);
    if (!ts.length) return '<div class="panel"><div class="empty">Cuando haya vistas, aquí aparecen los temas que más te convienen.</div></div>';
    return ts.map((t, i) => `<div class="panel topic">
        <div class="topic-top"><span class="ai-label">${SPARK}${i === 0 ? 'TU MEJOR TEMA' : 'TEMA #' + (i + 1)} · SEGÚN TUS DATOS</span><span class="mult ${t.mult < 1 ? 'low' : ''}">mediana ${t.mult.toFixed(1)}× la del canal</span></div>
        <h3>${esc(t.topic)}</h3>
        <p>${t.n} video(s) · mediana ${fmt(Math.round(t.med))} vistas${t.avgPct != null ? ' · ' + Math.round(t.avgPct) + '% visto' : ''}. ${t.viral ? '🔥 Aquí está tu video más visto: ' : 'El que más funcionó: '}<b style="color:var(--text)">"${esc(clean(t.best.title).slice(0, 70))}"</b> (${fmt(t.best.views)})${t.n < 3 ? ' — aún pocos videos, confirma con 2–3 más.' : '.'}</p>
      </div>`).join('');
  }

  // ---------- modal: todos los videos de la pestaña ----------
  function openModal(list){
    const m = $('modal');
    $('modalTitle').textContent = 'Todos los videos' + (TAB === 'todos' ? '' : ' · ' + TAB.charAt(0).toUpperCase() + TAB.slice(1)) + ' (' + list.length + ')';
    $('modalBody').innerHTML = videoList(list);
    m.style.display = 'flex'; document.body.style.overflow = 'hidden';
  }
  function closeModal(){ $('modal').style.display = 'none'; document.body.style.overflow = ''; }
  $('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
  $('modalClose').onclick = closeModal;
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

  // ---------- guion completo desde una idea ----------
  let lastScript = null;
  function scriptModal(title, html){ $('modalTitle').textContent = title; $('modalBody').innerHTML = html; $('modal').style.display = 'flex'; document.body.style.overflow = 'hidden'; }
  async function createScript(idea, engine){
    const job = 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    scriptModal('Escribiendo el guion…', `<div class="empty"><b style="color:var(--text)">${esc(idea.titulo)}</b><br><br>${engine === 'claude' ? 'Claude escribe el guion en tu PC (tu plan, $0)' : 'Gemini escribe el guion'}: la narración completa y después revisa cada imagen contra la narración y detalla todos los prompts para Flow y LTX.<br>Tarda 2–5 minutos. Puedes dejar esta ventana abierta.<br><br><span id="scriptClock">0 s</span></div>`);
    const t0 = Date.now(); const clock = setInterval(() => { const c = $('scriptClock'); if (c) c.textContent = Math.round((Date.now() - t0) / 1000) + ' s'; }, 1000);
    try {
      const k = key();
      const H = Object.assign({ 'Content-Type': 'application/json' }, k ? { 'x-vyrales-key': k } : {});
      if (engine === 'claude') {
        const r = await fetch('/.netlify/functions/analytics', { method: 'POST', headers: H, body: JSON.stringify({ action: 'claude_script', job, idea }) });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
        if (!j.online) { const c = $('scriptClock'); if (c) c.insertAdjacentHTML('afterend', '<br><span style="color:var(--orange)">⚠ La PC (Cronix) no responde ahora mismo: el guion se escribe cuando el agente vuelva. Si tienes prisa, cierra y usa el botón de Gemini.</span>'); }
      } else {
        const r = await fetch('/.netlify/functions/idea-script-background', { method: 'POST', headers: H, body: JSON.stringify({ job, idea }) });
        if (!r.ok && r.status !== 202) throw new Error('HTTP ' + r.status);
      }
      let out = null;
      while (Date.now() - t0 < 15 * 60000) {
        await new Promise((ok) => setTimeout(ok, 6000));
        if ($('modal').style.display === 'none') { clearInterval(clock); return; }
        const j = await (await fetch('/.netlify/functions/analytics?script=' + job, { cache: 'no-store' })).json();
        if (!j.pending) { out = j; break; }
      }
      clearInterval(clock);
      if (!out) throw new Error('No terminó en 15 minutos. Revisa la Terminal del panel o usa el botón de Gemini.');
      if (!out.ok) throw new Error(out.error || 'falló');
      showScript(out);
    } catch (err) { clearInterval(clock); scriptModal('No se pudo crear el guion', '<div class="err">' + esc(err.message) + '</div>'); }
  }
  function showScript(out){
    lastScript = out;
    const ep = out.series.episodes[0], v = out.validation || {};
    const words = ep.shots.map((s) => (s.dialogue || []).map((d) => d.line).join(' ')).join(' ').split(/\s+/).filter(Boolean).length;
    const txt = JSON.stringify(out.series, null, 2);
    scriptModal('Guion listo: ' + ep.title, `
      <div class="muted" style="margin-bottom:8px">${ep.shots.length} tomas · ${words} palabras (~${Math.round(words / 2.3)} s de voz) · ${esc(out.series.title)} · ${esc(out.model || '')} · costo $${(out.costUsd || 0).toFixed(3)}</div>
      ${v.ok ? '<div class="alert"><i style="background:var(--green);box-shadow:0 0 6px var(--green)"></i><span>Pasó la misma validación del botón PROMPT.</span></div>' : '<div class="err">La validación encontró problemas: ' + esc((v.errors || []).join(' · ')) + '</div>'}
      <div class="setup-actions" style="margin:10px 0">
        <button class="btn-sm" id="scCreate" style="border-color:rgba(61,220,151,.5);color:var(--green)" ${v.ok ? '' : 'disabled'}>Crear el video en el panel</button>
        <button class="btn-sm" id="scCopy">Copiar JSON</button>
        <button class="btn-sm" id="scDown">Descargar .json</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px">${ep.shots.map((s) => `<div class="panel" style="padding:8px 10px"><div class="muted"><b style="color:var(--cyan)">Toma ${s.n}</b> · ${esc(s.camera || '')}</div><div style="font-size:12.5px;margin:3px 0">${esc((s.dialogue || []).map((d) => d.line).join(' '))}</div><div class="muted">🖼 ${esc(s.start_en || '')}</div><div class="muted">🎬 ${esc(s.action_en || '')}</div></div>`).join('')}</div>
      <textarea readonly style="width:100%;height:180px;background:#060a16;color:var(--text-dim);border:1px solid var(--border);border-radius:10px;padding:10px;font:11px/1.4 ui-monospace,monospace">${esc(txt)}</textarea>`);
    $('scCopy').onclick = async () => { try { await navigator.clipboard.writeText(txt); toast('JSON copiado'); } catch (_) { window.prompt('Copia el JSON:', txt); } };
    $('scDown').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'application/json' })); a.download = (ep.title || 'guion').replace(/[^\wáéíóúñ -]/gi, '').trim().replace(/\s+/g, '_').slice(0, 60) + '.json'; a.click(); };
    $('scCreate').onclick = async () => {
      const b = $('scCreate'); b.disabled = true; b.textContent = 'Creando…';
      try {
        const r = await fetch('/.netlify/functions/import-series', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ series: out.series }) });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error((j.error || ('HTTP ' + r.status)) + (j.errors ? ' — ' + j.errors.join(' · ') : ''));
        try { localStorage.setItem('vyrales_series', out.series.slug); } catch (_) {}
        location.href = '/?series=' + encodeURIComponent(out.series.slug);
      } catch (err) { b.disabled = false; b.textContent = 'Crear el video en el panel'; alert('No se pudo crear: ' + err.message); }
    };
  }

  // ---------- video largo + Shorts (Claude en la PC, ~25 min) ----------
  async function createLargo(idea){
    const k = key();
    try {
      const r = await fetch('/.netlify/functions/analytics', { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, k ? { 'x-vyrales-key': k } : {}), body: JSON.stringify({ action: 'claude_largo', idea }) });
      const j = await r.json(); if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
      const list = store.get(lgKey()) || []; list.unshift({ job: j.job, titulo: idea.titulo, at: Date.now() }); store.set(lgKey(), list.slice(0, 10));
      toast(j.online ? 'Claude empezó el video largo en tu PC (~25 min)' : 'La PC no responde: empieza cuando vuelva');
      renderLargos();
    } catch (err) { alert('No se pudo pedir el video largo: ' + err.message); }
  }
  async function renderLargos(){
    const list = store.get(lgKey()) || []; const box = $('largosBox'); if (!box) return;
    box.style.display = list.length ? '' : 'none'; if (!list.length) return;
    $('largos').innerHTML = list.map((x) => `<div class="vid" id="lg_${x.job}"><span class="info"><span class="ttl">${esc(x.titulo || x.job)}</span><span class="meta" id="lgs_${x.job}">revisando…</span></span><span id="lgb_${x.job}"></span></div>`).join('');
    for (const x of list) {
      try {
        const g = await (await fetch('/.netlify/functions/analytics?script=' + x.job, { cache: 'no-store' })).json();
        const st = $('lgs_' + x.job), bt = $('lgb_' + x.job); if (!st) continue;
        if (g.pending || g.partial) { st.textContent = g.partial ? 'historia escrita · Claude detalla los prompts…' : 'Claude está escribiendo la historia… (' + Math.round((Date.now() - x.at) / 60000) + ' min)'; continue; }
        if (!g.ok) { st.innerHTML = '<span style="color:var(--red)">falló: ' + esc(g.error || '') + '</span>'; bt.innerHTML = `<button class="btn-sm" data-x="${x.job}">Quitar</button>`; bt.firstChild.onclick = () => { store.set(lgKey(), list.filter((y) => y.job !== x.job)); renderLargos(); }; continue; }
        st.textContent = `${g.minutes} min · ${g.long.shots.length} tomas · ${(g.shorts || []).length} Shorts`;
        bt.innerHTML = `<button class="btn-sm" style="border-color:rgba(61,220,151,.5);color:var(--green)">Ver y crear en el panel</button>`;
        bt.firstChild.onclick = () => showLargo(x, g);
      } catch (_) {}
    }
    if (list.some((x) => Date.now() - x.at < 60 * 60000)) { clearTimeout(renderLargos._t); renderLargos._t = setTimeout(renderLargos, 30000); }
  }
  function showLargo(x, g){
    const L = g.long; let chap = 0;
    const longHtml = L.shots.map((s) => { const head = s.chapter && s.chapter !== chap ? (chap = s.chapter, `<div style="color:var(--cyan);font-weight:800;margin:10px 0 4px">CAPÍTULO ${s.chapter}: ${esc(s.chapter_title || '')}</div>`) : ''; return head + `<div style="font-size:12.5px;margin:2px 0">${esc((s.dialogue || []).map((d) => d.line).join(' '))}</div>`; }).join('');
    const shortsHtml = (g.shorts || []).map((s, i) => `<div class="panel" style="padding:8px 10px;margin-top:8px"><b style="color:var(--pink)">SHORT ${i + 1}: ${esc(s.title)}</b>${s.shots.map((t) => `<div style="font-size:12px;margin-top:2px">${esc((t.dialogue || []).map((d) => d.line).join(' '))}</div>`).join('')}</div>`).join('');
    scriptModal(L.title, `<div class="muted" style="margin-bottom:8px">${g.minutes} min · ${L.shots.length} tomas · ${(g.shorts || []).length} Shorts con llamada a la acción · Claude (tu plan) · $0</div>
      <div class="setup-actions" style="margin-bottom:10px"><button class="btn-sm" id="lgCreate" style="border-color:rgba(61,220,151,.5);color:var(--green)">Crear largo + Shorts en el panel</button></div>
      <div class="panel" style="padding:10px 12px">${longHtml}</div>${shortsHtml}`);
    $('lgCreate').onclick = async () => {
      const b = $('lgCreate'); b.disabled = true; b.textContent = 'Creando…';
      try {
        const r = await fetch('/.netlify/functions/import-largo', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ job: x.job }) });
        const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status);
        store.set(lgKey(), (store.get(lgKey()) || []).filter((y) => y.job !== x.job));
        alert('✔ Listo: el video largo está en "Historias completas" (EP ' + j.long_episode + ') y los ' + j.shorts + ' Shorts en el canal vertical.');
        location.href = '/?series=' + encodeURIComponent(j.long_slug);
      } catch (err) { b.disabled = false; b.textContent = 'Crear largo + Shorts en el panel'; alert('No se pudo crear: ' + err.message); }
    };
  }

  // ---------- ideas IA ----------
  function claudePrompt(i){
    return `Escríbeme el prompt de VYRALES (documental narrado, una sola voz continua, ~${i.duracion_s || 75} s, video que se entiende solo) para este video:\nTítulo: ${i.titulo}\nGancho (primera frase del narrador): ${i.gancho}\nTema: ${i.tema}\nPor qué: ${i.por_que}`;
  }
  function renderIdeas(res){
    const box = $('ideas'); if (!box) return;
    if (!res || !res.ideas || !res.ideas.length) { box.innerHTML = '<div class="empty">Dale al botón: la IA lee tus estadísticas reales y propone 6 videos (5 de lo que ya te funciona + 1 prueba).</div>'; return; }
    $('ideasAt').textContent = new Date(res.at).toLocaleString('es', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    const showAll = !!renderIdeas._all;
    box.innerHTML = res.ideas.map((i, n) => `<div class="panel idea"${n >= 4 && !showAll ? ' style="display:none"' : ''}>
        <div class="topic-top"><span class="ai-label">${SPARK}${esc(String(i.tema || '').toUpperCase())}</span><span class="muted">~${i.duracion_s || 75} s</span></div>
        <h3>${esc(String(i.titulo || '').replace(/\s*#Shorts\b/gi, ''))}</h3>
        <div class="hook">“${esc(i.gancho)}”</div>
        <div class="why">${esc(i.por_que)}</div>
        <div class="idea-bottom"><div class="tags">${i.nuevo ? '<span class="tag-pill new">PRUEBA</span>' : ''}${(i.tags || []).slice(0, 3).map((t) => `<span class="tag-pill">${esc(t)}</span>`).join('')}</div>
          <span class="setup-actions"><button class="btn-sm" data-copy="${n}" title="Texto para pegarle a Claude">Copiar idea</button><button class="btn-sm" data-claude="${n}" style="border-color:rgba(61,220,151,.5);color:var(--green)" title="Un Short vertical (~1 min) escrito por Claude en tu PC ($0)">Crear Short ($0)</button><button class="btn-sm" data-largo="${n}" style="border-color:rgba(255,107,214,.6);color:var(--pink)" title="Video largo de YouTube (8–15 min, horizontal) + 3–5 Shorts verticales con llamada a la acción al video completo. Claude en tu PC ($0, ~25 min)">Crear Largo + Shorts ($0)</button></span></div></div>`).join('') + (res.ideas.length > 4 ? `<button class="generar-btn" id="ideasMore" style="padding:9px">${showAll ? 'MOSTRAR MENOS' : 'MOSTRAR MÁS (' + (res.ideas.length - 4) + ')'}</button>` : '');
    if ($('ideasMore')) $('ideasMore').onclick = () => { renderIdeas._all = !renderIdeas._all; renderIdeas(res); };
    box.querySelectorAll('[data-script]').forEach((b) => b.onclick = () => createScript(res.ideas[+b.dataset.script]));
    box.querySelectorAll('[data-claude]').forEach((b) => b.onclick = () => createScript(res.ideas[+b.dataset.claude], 'claude'));
    box.querySelectorAll('[data-largo]').forEach((b) => b.onclick = () => createLargo(res.ideas[+b.dataset.largo]));
    box.querySelectorAll('[data-copy]').forEach((b) => b.onclick = async () => {
      const txt = claudePrompt(res.ideas[+b.dataset.copy]);
      try { await navigator.clipboard.writeText(txt); toast('Copiado: pégaselo a Claude'); } catch (_) { window.prompt('Copia este texto:', txt); }
    });
  }
  async function genIdeas(){
    const b = $('genBtn'); b.disabled = true; const old = b.innerHTML; b.innerHTML = SPARK + ' ANALIZANDO TU CANAL…';
    try {
      const k = key();
      const H = Object.assign({ 'Content-Type': 'application/json' }, k ? { 'x-vyrales-key': k } : {});
      let r = await fetch('/.netlify/functions/analytics', { method: 'POST', headers: H, body: JSON.stringify({ action: 'ideas', focus: $('focus').value }) });
      let j = await r.json();
      if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
      if (j.offline) {
        if (!confirm('Tu PC (Cronix) no responde ahora, así que Claude no puede escribir las ideas gratis.\n\n¿Usar Gemini por API (~$0.01) solo esta vez?')) throw new Error('Prende la PC y vuelve a darle (gratis con Claude).');
        r = await fetch('/.netlify/functions/analytics', { method: 'POST', headers: H, body: JSON.stringify({ action: 'ideas', focus: $('focus').value, paid: true }) }); j = await r.json();
        if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
      } else if (j.queued) {
        b.innerHTML = SPARK + ' CLAUDE ESTÁ LEYENDO TU CANAL… (~1–2 min)';
        let out = null; const t0 = Date.now();
        while (!out && Date.now() - t0 < 6 * 60000) { await new Promise((ok) => setTimeout(ok, 5000)); const g = await (await fetch('/.netlify/functions/analytics?script=' + j.job, { cache: 'no-store' })).json(); if (!g.pending) out = g; }
        if (!out) throw new Error('Claude no respondió en 6 min (mira la Terminal del panel).');
        if (!out.ok) throw new Error(out.error || 'falló');
        j = out;
      }
      store.set(idKey(), j); renderIdeas(j); toast('Ideas listas · ' + (j.model || 'Gemini') + ' · costo $' + (j.costUsd || 0).toFixed(3));
    } catch (err) { $('ideas').innerHTML = '<div class="err">No se pudieron generar: ' + esc(err.message) + '</div>'; }
    b.disabled = false; b.innerHTML = old;
  }

  document.querySelectorAll('.tab').forEach((t) => t.onclick = () => { TAB = t.dataset.tab; store.set('vy_an_tab', TAB); if (DATA) render(); });
  cargarCanalActivo().then(() => load(false));
})();
</script>
