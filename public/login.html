<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="theme-color" content="#05070f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="VYRALES"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="robots" content="noindex">
<title>VYRALES · Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --a: 45 140 255; --b: 255 62 165; }
  * { box-sizing: border-box; }
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
  body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
    font-family: 'Space Grotesk', system-ui, sans-serif; color: #e9eefb; background-color: #05070f;
    background-image: linear-gradient(rgb(var(--a) / .045) 1px, transparent 1px), linear-gradient(90deg, rgb(var(--a) / .045) 1px, transparent 1px);
    background-size: 34px 34px; }
  form { position: relative; width: min(400px, 100%); padding: 32px 28px; border-radius: 20px; background: rgb(10 15 29 / .85);
    border: 1px solid #1b253e; box-shadow: 0 30px 80px rgb(0 0 0 / .55), 0 0 40px rgb(var(--a) / .08); backdrop-filter: blur(14px); }
  form::after { content: ''; position: absolute; inset: -1px; border-radius: inherit; padding: 1px; pointer-events: none;
    background: linear-gradient(90deg, rgb(var(--a)), rgb(var(--b)), #fff, rgb(var(--a))); background-size: 300% 100%;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
    animation: flow 5s linear infinite; opacity: .7; }
  @keyframes flow { to { background-position: 300% 0; } }
  .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .mark { width: 44px; height: 44px; border-radius: 13px; padding: 1px; background: linear-gradient(135deg, rgb(var(--a)), rgb(var(--b))); box-shadow: 0 0 18px rgb(var(--a) / .45); }
  .mark span { width: 100%; height: 100%; border-radius: 12px; background: #020307; color: rgb(var(--a)); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; }
  .name { font-weight: 700; font-size: 19px; letter-spacing: .2em; }
  .lab { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: rgb(var(--a)); }
  h1 { margin: 0 0 4px; font-size: 24px; }
  p { margin: 0 0 20px; color: #9aa6c2; font-size: 14px; line-height: 1.5; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
  input { width: 100%; min-height: 46px; padding: 0 14px; border-radius: 10px; border: 1px solid #1b253e; background: rgb(2 3 7 / .75);
    color: #fff; font: inherit; font-size: 16px; outline: none; transition: border-color .2s, box-shadow .2s; }
  input:focus { border-color: rgb(var(--a)); box-shadow: 0 0 16px rgb(var(--a) / .3); }
  .hint { font-size: 12px; color: #7a86a3; margin-top: 6px; }
  button { margin-top: 22px; width: 100%; min-height: 48px; border: 0; border-radius: 12px; cursor: pointer; font: inherit; font-weight: 700; font-size: 15px;
    color: #fff; background: linear-gradient(90deg, rgb(var(--a)), rgb(var(--b))); box-shadow: 0 0 18px rgb(var(--a) / .45); transition: transform .15s, box-shadow .3s; }
  button:hover { transform: translateY(-2px); box-shadow: 0 0 26px rgb(var(--a) / .7), 0 0 46px rgb(var(--b) / .4); }
  .err { display: none; margin-top: 14px; padding: 10px 12px; border-radius: 10px; font-size: 13px; color: #ffd3e6; border: 1px solid rgb(var(--b) / .45); background: rgb(var(--b) / .08); }
  @media (prefers-reduced-motion: reduce) { form::after { animation: none; } }
</style></head>
<body>
<form method="post" action="/.netlify/functions/login">
  <div class="logo"><div class="mark"><span>V</span></div><div><div class="name">VYRALES</div><div class="lab">Estudio de video IA</div></div></div>
  <h1>Entrar</h1>
  <p>Escribe el email y la contraseña de tu cuenta.</p>
  <label for="email">Email</label>
  <input id="email" type="email" name="email" placeholder="tu@correo.com" autocomplete="username" autofocus>
  <div class="hint">Administrador: deja el email vacío y usa tu llave del panel.</div>
  <label for="password">Contraseña</label>
  <input id="password" type="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
  <input type="hidden" name="next" id="next">
  <button type="submit">Entrar</button>
  <div class="err" id="err" role="alert">Email o contraseña incorrectos (o la cuenta está pausada).</div>
</form>
<script>
  var q = new URLSearchParams(location.search);
  document.getElementById('next').value = q.get('next') || '/';
  if (q.get('error')) document.getElementById('err').style.display = 'block';
</script>
</body></html>
