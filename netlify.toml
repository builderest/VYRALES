[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # ffmpeg-static trae un binario nativo: se copia tal cual (sin empaquetar) para que
  # _merge.js lo encuentre en producción.
  external_node_modules = ["ffmpeg-static"]

# daily-trigger YA NO corre programado: la produccion la dispara Franklin a mano (de noche)
# y los guiones de cada novela se escriben completos de una vez (arco entero) e importan
# con import-series. Si algun dia se quiere volver a automatizar, reponer aqui:
# [functions."daily-trigger"]
#   schedule = "0 13 * * *"
