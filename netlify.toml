[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # ffmpeg-static trae un binario nativo: se copia tal cual (sin empaquetar) para que
  # _merge.js lo encuentre en producción.
  external_node_modules = ["ffmpeg-static"]
  # Fuente de los subtítulos y tarjetas del editor (_render.js).
  included_files = ["netlify/functions/assets/fonts/**"]

# daily-trigger YA NO corre programado: la produccion la dispara Franklin a mano (de noche)
# y los guiones de cada novela se escriben completos de una vez (arco entero) e importan
# con import-series. Si algun dia se quiere volver a automatizar, reponer aqui:
# [functions."daily-trigger"]
#   schedule = "0 13 * * *"

# La raíz del sitio abre el dashboard directo (http://localhost:8888/ y https://vyrales.netlify.app/).
# status 200 = rewrite: la URL se queda en "/" y se sirve dashboard.html. /dashboard.html sigue funcionando.
[[redirects]]
  from = "/"
  to = "/dashboard.html"
  status = 200

# Candado: todo el sitio y las funciones piden sesión — netlify/edge-functions/auth.js (path "/*" en su config).

# Direcciones limpias para TikTok / Instagram (TikTok rechaza "/.netlify/..." como Redirect URI).
[[redirects]]
  from = "/auth/tiktok/callback"
  to = "/.netlify/functions/oauth-tiktok-callback"
  status = 200
[[redirects]]
  from = "/auth/instagram/callback"
  to = "/.netlify/functions/oauth-instagram-callback"
  status = 200
[[redirects]]
  from = "/auth/meta/callback"
  to = "/.netlify/functions/oauth-meta-callback"
  status = 200
[[redirects]]
  from = "/auth/youtube/callback"
  to = "/.netlify/functions/oauth-youtube-callback"
  status = 200
